<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkOrder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1e1b4b;--mut:#6b7280;--ac:#4f46e5;--ac2:#818cf8;--bd:#e5e7eb;--sb:#1e1b4b;--ok:#059669;--warn:#d97706;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#1a1b30;--tx:#e8e8f5;--mut:#9ca3af;--bd:#2d2e4a;--sb:#0a0a18}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:240px;background:var(--sb);color:#c7c9ee;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;transition:.2s}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:18px;padding:4px 10px 22px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal}
.nav{padding-bottom:84px}
.nav-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7c80b5;margin:16px 10px 6px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07)}.nav a.on{background:var(--ac);color:#fff}
main{flex:1;padding:24px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px}.sub{color:var(--mut);margin-top:2px}
.burger{display:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--tx)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi .l{color:var(--mut);font-size:12px;font-weight:500}.kpi .v{font-size:24px;font-weight:700;margin-top:6px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card h3{margin:0 0 14px;font-size:15px}
.bar{margin-bottom:12px}.bar .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .t{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.bar .f{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
.tools input,.tools select{width:auto;min-width:160px}.tools .grow{flex:1}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:transparent}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:hover{opacity:.9}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:hover td{background:rgba(129,140,248,.06)}
td.n,th.n{text-align:right}td.act{text-align:right}
.act a{color:var(--ac);cursor:pointer;margin-left:10px;font-weight:500}.act a.d{color:var(--bad)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.Baru{background:#e0e7ff;color:#4338ca}.Proses{background:#fef3c7;color:#b45309}.Selesai{background:#d1fae5;color:#047857}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,16,32,.55)}
.mh{padding:18px 22px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px}
.mb{padding:20px 22px;display:grid;gap:14px;grid-template-columns:1fr 1fr}.mb label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}.mb .full{grid-column:1/-1}
.mf{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px}
#login{position:fixed;inset:0;z-index:50;display:none;background:var(--card)}
#login.on{display:grid;grid-template-columns:1fr 1fr}
.lg-l{position:relative;overflow:hidden;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 55%,#6d28d9 100%);color:#fff;padding:50px 56px;display:flex;flex-direction:column;justify-content:space-between}
.lg-l:before,.lg-l:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.lg-l:before{width:640px;height:640px;top:-300px;right:-300px}
.lg-l:after{width:440px;height:440px;bottom:-230px;left:-220px}
.lg-l>*{position:relative;z-index:1}
.lg-b{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px}
.lg-b i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#818cf8);display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lg-h{font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;max-width:420px}
.lg-f{font-size:12px;opacity:.75}
.lg-r{display:grid;place-items:center;padding:24px;background:var(--card)}
.lc{width:min(380px,100%);display:grid;gap:8px}
.lc h2{margin:0;font-size:24px;font-weight:700}
.lc .sub{font-size:13px;margin:0 0 14px}
.lc label{font-size:13px;font-weight:600;color:var(--tx);margin-top:6px}
.lc input{padding:12px 14px;border-radius:10px}
.lc .btn{width:100%;padding:13px;margin-top:6px}
#le{color:var(--bad);font-size:13px;min-height:18px}
@media(max-width:820px){#login.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}.lg-l{padding:22px 24px}.lg-h,.lg-f{display:none}}
.me{position:absolute;bottom:16px;left:14px;right:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#fff;background:var(--sb)}
.me a{color:#a5b4fc;cursor:pointer;display:inline-block;margin-top:6px}
.fb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;margin-bottom:14px}
.fb input{flex:1;min-width:200px}.fb select{width:auto;min-width:140px}
.rs{color:var(--ac);font-weight:600;cursor:pointer;padding:0 8px}.cnt{padding:10px 12px;color:var(--mut);font-size:12px}
.cb{position:relative}.cb>input:not([type=hidden]){padding-right:36px}
.cb .ic{position:absolute;right:12px;top:11px;color:var(--mut);pointer-events:none}
.cl{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 36px rgba(15,16,32,.22);max-height:230px;overflow:auto;z-index:30;display:none;padding:6px}
.ci{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}.ci:hover,.ci.on{background:rgba(79,70,229,.12);color:var(--ac)}
.ci.nw{color:var(--mut);cursor:default;font-size:13px}.ci.nw:hover{background:none;color:var(--mut)}
.dp .dpi{cursor:pointer}.dpc{width:264px;padding:10px;max-height:none;overflow:visible}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.dh a{cursor:pointer;padding:2px 12px;border-radius:8px;font-size:20px;line-height:1.1}.dh a:hover{background:rgba(79,70,229,.12)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dg u{text-decoration:none;font-size:11px;color:var(--mut);padding:3px 0;font-weight:600}
.dg b{font-weight:500;padding:5px 0;border-radius:8px;cursor:pointer;font-size:12px}.dg b:hover{background:rgba(79,70,229,.12)}
.dg b.td{color:var(--ac);font-weight:700}.dg b.sel{background:var(--ac);color:#fff}
.df{text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd)}.df a{color:var(--ac);font-weight:600;cursor:pointer}
.pg{border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 12px}
.pb select{width:auto;padding:6px 10px;border-radius:8px}.pb{display:flex;gap:6px;align-items:center}.pb span{color:var(--mut)}
.pb button{padding:0 12px;min-width:34px;height:34px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
.pb button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}.pb button.on{background:var(--ac);border-color:var(--ac);color:#fff}.pb button:disabled{opacity:.4;cursor:default}
.kpi .us,.us{color:var(--mut);font-size:12px;margin-top:6px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 14px;border-radius:99px;border:1px solid var(--bd);cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}
.chip:hover{border-color:var(--ac);color:var(--ac)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
dialog.wide{width:min(920px,96vw)}
.it{display:grid;grid-template-columns:2.2fr 1fr .9fr .7fr 1.2fr 1.6fr 24px;gap:8px;margin-bottom:8px;align-items:center}
.it a{color:var(--bad);cursor:pointer;text-align:center;font-weight:700}
.ith{display:grid;grid-template-columns:2.2fr 1fr .9fr .7fr 1.2fr 1.6fr 24px;gap:8px;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:6px}
#cnt{color:var(--ac);margin-left:6px}
@media(max-width:820px){.it{grid-template-columns:1fr 1fr}.it .u,.it .k{grid-column:1/-1}.ith{display:none}}
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:99}.toast.s{opacity:1}
.empty{text-align:center;color:var(--mut);padding:40px}
#spkc{color:var(--ac);margin-left:6px}
.spkl{max-height:340px;overflow:auto;border:1px solid var(--bd);border-radius:10px;margin:6px 0 8px}
.spi{display:grid;grid-template-columns:22px 1.1fr 3fr 2.2fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}
.spi:last-child{border-bottom:0}.spi:hover{background:rgba(129,140,248,.08)}.spi.on{background:rgba(79,70,229,.12)}
.spi input{width:auto;padding:0;pointer-events:none;accent-color:var(--ac)}
.spi .sc{font-weight:600}.spi .sm{color:var(--mut);font-size:12px}
@media(max-width:820px){.spi{grid-template-columns:22px 1fr}.spi .sm,.spi .badge{grid-column:2;justify-self:start}}
@media(max-width:820px){aside{position:fixed;z-index:9;left:-250px}aside.o{left:0}.burger{display:block}main{padding:16px}.mb{grid-template-columns:1fr}}
@media print{aside,.tools,.fb,.pg,.burger,.act{display:none!important}main{padding:0}}

/* ===== SPK: pilihan tampilan daftar order ===== */
.spt{width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;font-size:13px}
.spt th{position:sticky;top:0;background:var(--card);z-index:1;padding:8px 10px}
.spt td{padding:9px 10px;vertical-align:middle}.spt td.w{white-space:normal;line-height:1.4;word-break:break-word}
.spr{cursor:pointer}.spr.on td{background:rgba(79,70,229,.12)}
.spt input,.spc input,.spd input{width:auto;padding:0;pointer-events:none;accent-color:var(--ac)}
.spc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:8px}
.spc{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
.spc:hover{border-color:var(--ac2)}.spc.on{border-color:var(--ac);background:rgba(79,70,229,.10)}
.spc .badge{display:inline-block;margin-top:6px}.spc .t div{margin-top:2px;line-height:1.4}
.spd{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px;line-height:1.4}
.spd:hover{background:rgba(129,140,248,.08)}.spd.on{background:rgba(79,70,229,.12)}
.spg-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:6px 12px;background:var(--bg);color:var(--mut);font-size:12px;font-weight:700;border-bottom:1px solid var(--bd)}
.spg-h span:first-child{color:var(--tx)}

/* ===== Hasil Kerja ===== */
.hk{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr 1.4fr;gap:8px;}
.hk span{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
@media(max-width:820px){.hk{grid-template-columns:1fr 1fr}}

/* ===== Pengaturan: pilihan tampilan form ===== */
.fso{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fo{border:2px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.fo:hover{border-color:var(--ac2)}.fo.on{border-color:var(--ac);background:rgba(79,70,229,.08)}
.fo svg{width:100%;max-width:110px;height:auto;color:var(--mut)}
.fo b{display:block;margin-top:8px}.fo span{font-size:12px;color:var(--mut)}
.cr{text-align:center;color:var(--mut);margin-top:48px;font-size:13px;line-height:1.7}.cr b{color:var(--tx)}

/* ===== Tampilan form (data-fs di <dialog>) ===== */
dialog[data-fs=compact]{width:min(400px,94vw)}
dialog[data-fs=compact].wide{width:min(720px,96vw)}
dialog[data-fs=compact] .mb{grid-template-columns:1fr;gap:10px;padding:16px 18px}
dialog[data-fs=side],dialog[data-fs=sheet],dialog[data-fs=full]{max-width:100vw;max-height:100vh}
dialog[data-fs=side] form,dialog[data-fs=sheet] form,dialog[data-fs=full] form{display:flex;flex-direction:column;height:100%}
dialog[data-fs=side] .mb,dialog[data-fs=sheet] .mb,dialog[data-fs=full] .mb{flex:1;overflow:auto;align-content:start}
dialog[data-fs=side]{margin:0 0 0 auto;height:100vh;width:min(480px,100vw);border-radius:16px 0 0 16px}
dialog[data-fs=side].wide{width:min(780px,100vw)}
dialog[data-fs=side] .mb{grid-template-columns:1fr}
dialog[data-fs=sheet]{margin:auto auto 0;width:min(760px,100vw);max-height:88vh;border-radius:16px 16px 0 0}
dialog[data-fs=sheet].wide{width:min(920px,100vw)}
dialog[data-fs=sheet] form{max-height:88vh}
dialog[data-fs=full]{margin:0;width:100vw;height:100vh;border-radius:0}
dialog[data-fs=full] .mb{width:100%;max-width:980px;margin:0 auto}
dialog[data-fs=side][open]{animation:fsIn .2s ease}
dialog[data-fs=sheet][open]{animation:fsUp .2s ease}
@keyframes fsIn{from{transform:translateX(40px);opacity:0}}
@keyframes fsUp{from{transform:translateY(40px);opacity:0}}
@media(max-width:820px){dialog[data-fs=side],dialog[data-fs=side].wide{width:100vw;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <aside id="sb">
    <div class="logo"><i>▤</i>WorkOrder</div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div id="who"></div><a onclick="logout()">⎋ Keluar</a></div>
  </aside>
  <main>
    <div class="top">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="burger" onclick="sb.classList.toggle('o')">☰</button>
        <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
      </div>
      <div id="topact"></div>
    </div>
    <div id="view"><div class="empty">Memuat data…</div></div>
  </main>
</div>
<div id="login">
  <div class="lg-l">
    <div class="lg-b"><i>▤</i>WorkOrder</div>
    <h2 class="lg-h">Kelola Order dan Produksi dengan Mudah dan Terukur.</h2>
    <div class="lg-f">© 2026 WorkOrder</div>
  </div>
  <div class="lg-r">
    <form id="lf" class="lc">
      <h2>Masuk ke Sistem</h2>
      <div class="sub">Silakan login menggunakan akun Anda.</div>
      <label>Username</label><input id="lu" autocomplete="username" required>
      <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
      <div id="le"></div><button class="btn" id="lb">Masuk</button>
    </form>
  </div>
</div>
<dialog id="dlg"><form method="dialog" id="frm"><div class="mh" id="mh"></div><div class="mb" id="mb"></div>
<div class="mf"><button type="button" class="btn g" onclick="dlg.close()">Batal</button><button class="btn" type="submit">Simpan</button></div></form></dialog>
<div class="toast" id="toast"></div>

<script>
/* ====== MODE GITHUB PAGES ======
   Tempel URL web app Apps Script (berakhiran /exec) di bawah ini.
   Jika halaman dibuka langsung dari URL Apps Script, bagian ini tidak dipakai. */
const API_URL='https://script.google.com/macros/s/AKfycbyH485Suonibrr1NonBRPf60EMMbIWhT9NSqEdsNXg9AYjr2kLNjkB-dQoyM5ginSpd/exec';
const VER='1.2.2';
if(typeof google==='undefined'){
  const mk=(ok,fail)=>new Proxy({},{get:(_,k)=>{
    if(k==='withSuccessHandler')return f=>mk(f,fail);
    if(k==='withFailureHandler')return f=>mk(ok,f);
    return(...args)=>{
      fetch(API_URL,{method:'POST',body:JSON.stringify({fn:k,args})})
        .then(r=>r.json())
        .then(j=>{
          if(j.error)throw new Error(j.error);
          return j;
        })
        .then(
          j=>{ok&&ok(j.data)},
          e=>{
            const m=/Failed to fetch|JSON|NetworkError/.test(e.message)
              ?new Error('Tidak bisa terhubung ke server. Cek API_URL & deployment.'):e;
            fail?fail(m):console.error(m);
          });
    }}});
  window.google={script:{get run(){return mk()}}};
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('id-ID');
const rp=n=>'Rp '+num(Math.round(n));
const sum=(a,f)=>a.reduce((t,x)=>t+Number(f(x)||0),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const STATUS=['Baru','Proses','Selesai'];
const PAGES={
  dashboard:{t:'Dashboard',s:'Ringkasan produksi & penjualan',ic:'◧',g:'Menu'},
  orders:{t:'Order',s:'Daftar PO / Surat Jalan',ic:'▤',g:'Menu',sheet:'Orders',f:[['Tgl','Tanggal','date'],['Customer','Customer','customer'],['Uraian','Uraian','text','full'],['Ukuran','Ukuran'],['Jumlah','Jumlah','number'],['Satuan','Satuan'],['PO_SJ','PO/SJ'],['Harga','Harga PO','number'],['Keterangan','Keterangan','text','full'],['Status','Status','status']]},
  customer:{t:'Customer',s:'Data pelanggan',ic:'☻',g:'Menu',sheet:'Customer',f:[['Nama','Nama Customer','text','full'],['Telp','Telepon'],['Alamat','Alamat','text','full']]},
  spk:{t:'SPK',s:'Surat Perintah Kerja',ic:'☰',g:'Produksi'},
  hk:{t:'Hasil Kerja',s:'Laporan hasil kerja dari SPK',ic:'①',g:'Produksi'},
  laporan:{t:'Laporan',s:'Rekap order & progres produksi',ic:'▥',g:'Lainnya'},
  pengguna:{t:'Pengguna',s:'Akun yang bisa masuk ke aplikasi',ic:'⚿',g:'Lainnya'},
  pengaturan:{t:'Pengaturan',s:'Tampilan form & info aplikasi',ic:'⚙',g:'Lainnya'}
};
let D={Customer:[],Orders:[],SPK:[],HasilKerja:[]},page='dashboard',q='',R={from:'',to:'',cust:''};

/* ---------- Pengaturan tampilan form (disimpan di browser) ---------- */
const FSO=[['std','Standar','Jendela di tengah layar'],['compact','Kompak','Jendela ramping & rapat'],['side','Panel Samping','Form muncul dari kanan'],['sheet','Lembar Bawah','Form naik dari bawah'],['full','Layar Penuh','Form memenuhi layar']];
let FS='std';
try{const s=localStorage.getItem('wo_fs');if(FSO.some(o=>o[0]===s))FS=s}catch(e){}

const SLO=[['tabel','Tabel','Kolom sejajar rapi'],['kartu','Kartu','Satu kotak per order'],['ringkas','Dua Baris','Padat, info di bawah'],['grup','Per Customer','Dikelompokkan customer']];
let SL='tabel';
try{const s=localStorage.getItem('wo_sl');if(SLO.some(o=>o[0]===s))SL=s}catch(e){}

function nav(){let g='',h='';for(const k in PAGES){const p=PAGES[k];if(p.g!==g){g=p.g;h+=`<div class="nav-g">${g}</div>`}h+=`<a class="${k===page?'on':''}" onclick="go('${k}')"><span>${p.ic}</span>${p.t}</a>`}$('#nav').innerHTML=h}

let TOKEN='',ME={};

function api(fn,args,ok){google.script.run.withSuccessHandler(ok||(()=>{})).withFailureHandler(e=>{if(/SESSION/.test(e.message))showLogin('Sesi berakhir, silakan masuk lagi.');else toast(e.message)})[fn](TOKEN,...args)}

const ordLabel=id=>{const o=D.Orders.find(x=>x.ID===id);return o?`${o.Customer} · ${o.Uraian}`:'-'};

/* ---------- Helper Hasil Kerja: total per order & sisa ---------- */
let TT={};
const HKT=()=>{const m={};(D.HasilKerja||[]).forEach(r=>[1,2,3].forEach(n=>{m[r.OrderID]=(m[r.OrderID]||0)+Number(r['L'+n+'_Jml']||0)+Number(r['L'+n+'_Koreksi']||0)}));return m};
const sisa=o=>Number(o.Jumlah||0)-(TT[o.ID]||0);
const hkRec=(no,oid)=>(D.HasilKerja||[]).find(r=>String(r.SPKNo)===String(no)&&r.OrderID===oid);

  TT=HKT();

function bars(items,max){return items.map(([l,v,t])=>`<div class="bar"><div class="r"><span>${esc(l)}</span><b>${t}</b></div><div class="t"><div class="f" style="width:${max?Math.min(100,v/max*100):0}%"></div></div></div>`).join('')||'<div class="empty">Belum ada data</div>'}

let DU='',DUS=[];
const unitOf=o=>String(o.Satuan||'').trim().toLowerCase()||'-';
const uLbl=u=>u==='-'?'':u;
const fm=(v,u)=>num(v)+(uLbl(u)?' '+uLbl(u):'');
function setDU(i){DU=DUS[i];dashboard()}
function dashboard(){
  const O=D.Orders,nilai=sum(O,o=>o.Jumlah*o.Harga),aktif=O.filter(o=>o.Status!=='Selesai').length;
  const cnt={},U={};O.forEach(o=>{const u=unitOf(o);cnt[u]=(cnt[u]||0)+1;U[u]=(U[u]||0)+Number(o.Jumlah||0)});
  const units=Object.keys(U).sort((a,b)=>cnt[b]-cnt[a]);DUS=units;
  if(!U[DU])DU=units[0]||'m';
  const mTot=U['m']||0;
  const mO=O.filter(o=>unitOf(o)==='m'),done=sum(mO,o=>TT[o.ID]||0),sis=sum(mO,o=>Math.max(0,sisa(o)));
  const st=[['Hasil Kerja (m)',done,`${num(done)} m (${mTot?Math.round(done/mTot*100):0}%)`],['Sisa Order (m)',sis,`${num(sis)} m`]];
  const by={};O.filter(o=>unitOf(o)===DU).forEach(o=>by[o.Customer]=(by[o.Customer]||0)+Number(o.Jumlah||0));
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rec=O.slice(-6).reverse();
  const unitCards=units.map(u=>`<div class="card kpi"><div class="l">Total ${esc(uLbl(u)||'tanpa satuan')}</div><div class="v">${fm(U[u],u)}</div><div class="us">${num(cnt[u])} order</div></div>`).join('');
  $('#view').innerHTML=`<div class="grid">
   <div class="card kpi"><div class="l">Total Order</div><div class="v">${num(O.length)}</div></div>
   <div class="card kpi"><div class="l">Nilai PO</div><div class="v">${rp(nilai)}</div></div>
   <div class="card kpi"><div class="l">Order Aktif</div><div class="v">${num(aktif)}</div></div></div>
   <div class="grid">${unitCards||'<div class="card kpi"><div class="l">Total Jumlah</div><div class="v">0</div></div>'}</div>
   <div class="two"><div class="card"><h3>Progres Produksi</h3>${bars(st,mTot)}<div class="us" style="margin-top:12px">Hasil kerja dalam meter (termasuk koreksi), persentase terhadap total order satuan m.</div></div>
   <div class="card"><h3>Top Customer (${esc(uLbl(DU)||'tanpa satuan')})</h3>
    <div class="chips">${units.map((u,i)=>`<span class="chip ${u===DU?'on':''}" onclick="setDU(${i})">${esc(uLbl(u)||'tanpa satuan')}</span>`).join('')}</div>
    ${bars(top.map(([n,v])=>[n,v,fm(v,DU)]),top[0]?.[1])}</div></div>
   <div class="card" style="margin-top:16px"><h3>Order Terbaru</h3><div class="tw"><table><tr><th>Tgl</th><th>Customer</th><th>Uraian</th><th class="n">Jumlah</th><th>Status</th></tr>
   ${rec.map(o=>`<tr><td>${esc(o.Tgl)}</td><td>${esc(o.Customer)}</td><td>${esc(o.Uraian)}</td><td class="n">${num(o.Jumlah)} ${esc(o.Satuan)}</td><td><span class="badge ${o.Status}">${o.Status}</span></td></tr>`).join('')||'<tr><td colspan=5 class="empty">Belum ada order</td></tr>'}</table></div></div>`;
}
function cell(k,t,v){
  if(t==='order')return esc(ordLabel(v));
  if(k==='Status')return `<span class="badge ${v}">${esc(v)}</span>`;
  if(k==='Harga')return rp(v);
  return esc(v);
}
let F={status:'',per:'',cust:''};
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const perLbl=v=>BLN[+v.slice(5,7)-1]+' '+v.slice(0,4);
const norm=x=>String(x??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function rowsF(){
  const p=PAGES[page],tk=q.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  return D[p.sheet].filter(r=>{
    if(tk.length){const h=norm(Object.values(r).join(' ')+' '+(r.OrderID?ordLabel(r.OrderID):''));if(!tk.every(t=>h.includes(t)))return false}
    return (!F.status||r.Status===F.status)&&(!F.per||String(r.Tgl).slice(0,7)===F.per)&&(!F.cust||r.Customer===F.cust);
  });
}
function tableView(){
  const p=PAGES[page],has=k=>p.f.some(f=>f[0]===k);
  const pers=has('Tgl')?[...new Set(D[p.sheet].map(r=>String(r.Tgl).slice(0,7)).filter(x=>/^\d{4}-\d\d$/.test(x)))].sort().reverse():[];
  const sel=(opts,cur,set,all)=>`<select onchange="${set}=this.value;PG=1;fill()"><option value="">${all}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  $('#view').innerHTML=`<div class="tools"><button class="btn g" onclick="csvT()">⭳ Ekspor CSV</button><button class="btn g" onclick="printAll()">⭳ Unduh PDF</button><button class="btn g" onclick="printAll()">⎙ Cetak</button></div>
  <div class="card fb"><input id="qs" placeholder="${page==='orders'?'Cari customer, uraian, nomor PO / SJ…':'Cari…'}" value="${esc(q)}" oninput="q=this.value;PG=1;fill()">
   ${has('Status')?sel(STATUS.map(x=>[x,x]),F.status,'F.status','Semua Status'):''}
   ${pers.length?sel(pers.map(v=>[v,perLbl(v)]),F.per,'F.per','Semua Periode'):''}
   ${has('Customer')?sel(D.Customer.map(c=>[c.Nama,c.Nama]),F.cust,'F.cust','Semua Customer'):''}
   <a class="rs" onclick="q='';PG=1;F={status:'',per:'',cust:''};tableView()">Reset</a></div>
  <div class="card" style="padding:6px"><div class="tw" id="tb"></div><div class="pg" id="pgb"></div></div>`;
  fill();
}
let PG=1,ALL=false,PS=10;
function fill(){
  const p=PAGES[page],all=rowsF(),ps=ALL?1e9:PS,pages=Math.max(1,Math.ceil(all.length/ps));
  PG=Math.min(Math.max(1,PG),pages);
  const st=(PG-1)*ps,rows=all.slice(st,st+ps),isO=page==='orders';
  $('#tb').innerHTML=`<table><tr>${p.f.map(f=>`<th class="${f[2]==='number'?'n':''}">${f[1]}</th>`).join('')}${isO?'<th class="n">Sisa</th>':''}<th></th></tr>
  ${rows.map(r=>`<tr>${p.f.map(f=>`<td class="${f[2]==='number'?'n':''}">${f[2]==='number'&&f[0]!=='Harga'?num(r[f[0]]):cell(f[0],f[2],r[f[0]])}</td>`).join('')}${isO?`<td class="n"><b>${num(sisa(r))}</b></td>`:''}<td class="act"><a onclick="edit('${r.ID}')">Edit</a><a class="d" onclick="del('${r.ID}')">Hapus</a></td></tr>`).join('')||`<tr><td colspan="${p.f.length+2}" class="empty">Tidak ada data</td></tr>`}</table>`;
  $('#pgb').innerHTML=`<span class="cnt">${all.length?`Menampilkan ${st+1}–${st+rows.length} dari ${all.length} data`:'0 data'}</span>
  <div class="pb"><select onchange="PS=+this.value;PG=1;fill()">${[10,25,50,100].map(x=>`<option ${x===PS?'selected':''}>${x}</option>`).join('')}</select>
  <button ${PG<=1?'disabled':''} onclick="gp(${PG-1})">‹ Sebelumnya</button><span>Hal ${PG}/${pages}</span><button ${PG>=pages?'disabled':''} onclick="gp(${PG+1})">Berikutnya ›</button></div>`;
}
function gp(n){PG=n;fill();$('#tb').scrollIntoView({block:'start',behavior:'smooth'})}
function printAll(){ALL=true;fill();setTimeout(()=>{print();ALL=false;fill()},100)}
function csvT(){
  const p=PAGES[page],rows=rowsF(),ks=p.f.map(f=>f[0]);
  const t=[p.f.map(f=>f[1]).join(',')].concat(rows.map(r=>ks.map(k=>'"'+String(k==='OrderID'?ordLabel(r[k]):(r[k]??'')).replace(/"/g,'""')+'"').join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=p.t+'.csv';a.click();
}
function edit(id){
  const p=PAGES[page],r=id?D[p.sheet].find(x=>x.ID===id):{Tgl:today(),Status:'Baru'};
  $('#mh').textContent=(id?'Edit ':'Tambah ')+p.t;
  $('#mb').innerHTML=p.f.map(([k,l,t,w])=>{
    let i;const v=esc(r[k]);
    if(t==='customer')i=cbox(k,r[k]);
    else if(t==='order')i=`<select name="${k}" required><option value="">— pilih order —</option>${D.Orders.map(o=>`<option value="${o.ID}" ${o.ID===r[k]?'selected':''}>${esc(o.Customer+' · '+o.Uraian)}</option>`).join('')}</select>`;
    else if(t==='status')i=`<select name="${k}">${STATUS.map(s=>`<option ${s===r[k]?'selected':''}>${s}</option>`).join('')}</select>`;
    else if(t==='date')i=dpBox(k,r[k]);
    else i=`<input name="${k}" type="${t==='date'?'date':t==='number'?'number" step="any':'text'}" value="${v}">`;
    return `<div class="${w||''}"><label>${l}</label>${i}</div>`}).join('');
  frm.dataset.id=id||'';frm.dataset.multi='';frm.dataset.mode='';dlg.classList.remove('wide');openD();
}
/* showModal() otomatis fokus ke input pertama (tanggal) -> kalender ikut terbuka. Lepas fokusnya. */
let NOOPEN=false;
function openD(){dlg.dataset.fs=FS;NOOPEN=true;dlg.showModal();const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();NOOPEN=false}
const CAL='<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const CHV='<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const dFmt=v=>{if(!/^\d{4}-\d\d-\d\d$/.test(v||''))return '';const[y,m,d]=v.split('-');return +d+' '+MON[m-1]+' '+y};
/* --- Customer combobox --- */
function cbox(k,v){return `<div class="cb"><input name="${k}" value="${esc(v)}" autocomplete="off" required oninput="cbF(this)" onfocus="cbF(this)" onblur="cbH(this)" onkeydown="cbK(this,event)">${CHV}<div class="cl"></div></div>`}
function cbF(i){
  const l=i.parentNode.querySelector('.cl'),v=i.value.trim().toLowerCase();
  const m=D.Customer.map(c=>String(c.Nama)).filter(n=>!v||n.toLowerCase().includes(v));
  const exact=D.Customer.some(c=>String(c.Nama).toLowerCase()===v);
  l.innerHTML=m.map(n=>`<div class="ci" onmousedown="cbP(this,event)">${esc(n)}</div>`).join('')
    +(v&&!exact?`<div class="ci nw" onmousedown="event.preventDefault()">＋ Customer baru: <b>${esc(i.value.trim())}</b></div>`:'')
    ||'<div class="ci nw">Belum ada customer</div>';
  l.style.display='block';
}
function cbP(el,e){e.preventDefault();const b=el.closest('.cb');b.querySelector('input').value=el.textContent;b.querySelector('.cl').style.display='none'}
function cbH(i){setTimeout(()=>{const l=i.parentNode.querySelector('.cl');if(l)l.style.display='none'},120)}
function cbK(i,e){
  const l=i.parentNode.querySelector('.cl'),it=[...l.querySelectorAll('.ci:not(.nw)')];let a=it.findIndex(x=>x.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(l.style.display!=='block')cbF(i);
    it.forEach(x=>x.classList.remove('on'));a=e.key==='ArrowDown'?Math.min(it.length-1,a+1):Math.max(0,a-1);
    if(it[a]){it[a].classList.add('on');it[a].scrollIntoView({block:'nearest'})}}
  else if(e.key==='Enter'&&a>=0&&l.style.display==='block'){e.preventDefault();i.value=it[a].textContent;l.style.display='none'}
}
/* --- Date picker --- */
function dpBox(k,v){v=v||today();return `<div class="cb dp"><input type="hidden" name="${k}" value="${v}"><input class="dpi" readonly value="${dFmt(v)}" onfocus="dpOpen(this)" onclick="dpOpen(this)" onblur="cbH(this)">${CAL}<div class="cl dpc"></div></div>`}
function dpOpen(i){if(NOOPEN)return;const b=i.parentNode,[y,m]=b.querySelector('[type=hidden]').value.split('-');b._y=+y;b._m=+m-1;dpR(b);b.querySelector('.cl').style.display='block'}
function dpR(b){
  const h=b.querySelector('[type=hidden]').value,y=b._y,m=b._m,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=today();
  let c='';for(let i=0;i<first;i++)c+='<i></i>';
  for(let d=1;d<=n;d++){const v=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');c+=`<b class="${v===h?'sel':v===t?'td':''}" onmousedown="dpP(this,'${v}',event)">${d}</b>`}
  b.querySelector('.cl').innerHTML=`<div class="dh"><a onmousedown="dpN(this,-1,event)">‹</a><span>${MON[m]} ${y}</span><a onmousedown="dpN(this,1,event)">›</a></div>
   <div class="dg">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<u>${x}</u>`).join('')}${c}</div><div class="df"><a onmousedown="dpP(this,'${t}',event)">Hari ini</a></div>`;
}
function dpN(el,d,e){e.preventDefault();const b=el.closest('.dp');b._m+=d;if(b._m<0){b._m=11;b._y--}if(b._m>11){b._m=0;b._y++}dpR(b)}
function dpP(el,v,e){e.preventDefault();const b=el.closest('.dp');b.querySelector('[type=hidden]').value=v;b.querySelector('.dpi').value=dFmt(v);b.querySelector('.cl').style.display='none';if(frm.dataset.mode==='spk')spkPrev()}

  $('#mh').textContent='Tambah Order (1 PO, maks. 10 item)';
  $('#mb').innerHTML=`<div><label>Tanggal</label>${dpBox('Tgl')}</div>
   <div><label>Customer</label>${cbox('Customer','')}</div>
   <div><label>PO/SJ</label><input name="PO_SJ" required></div>
   <div><label>Status</label><select name="Status">${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div>
   <div class="full"><label>Item Order<span id="cnt"></span></label>
    <div class="ith"><span>Uraian</span><span>Ukuran</span><span>Jumlah</span><span>Satuan</span><span>Harga PO</span><span>Keterangan</span><span></span></div>

function addItem(){
  const box=$('#items');if(box.children.length>=10){toast('Maksimal 10 item per PO');return}
  const d=document.createElement('div');d.className='it';
  d.innerHTML=`<input name="Uraian" class="u"><input name="Ukuran"><input name="Jumlah" type="number" step="any"><input name="Satuan"><input name="Harga" type="number" step="any"><input name="Keterangan" class="k"><a title="Hapus item" onclick="if($('#items').children.length>1){this.parentNode.remove();cnt()}">✕</a>`;
  box.appendChild(d);cnt();
}
function cnt(){$('#cnt').textContent=$('#items').children.length+'/10'}
function saveMulti(e){
  const v=(d,k)=>d.querySelector(`[name=${k}]`).value;
  const items=[...$('#items').children].map(d=>({Uraian:v(d,'Uraian').trim(),Ukuran:v(d,'Ukuran'),Jumlah:Number(v(d,'Jumlah')||0),Satuan:v(d,'Satuan'),Harga:Number(v(d,'Harga')||0),Keterangan:v(d,'Keterangan').trim()})).filter(i=>i.Uraian||i.Jumlah);
  if(!items.length){e.preventDefault();toast('Isi minimal 1 item');return}
  const h={Tgl:frm.elements.Tgl.value,Customer:frm.elements.Customer.value,PO_SJ:frm.elements.PO_SJ.value,Status:frm.elements.Status.value};
  api('saveBatch',['Orders',items.map(i=>({...h,...i}))],n=>{toast(n+' item tersimpan ✓');load()});
}
frm.onsubmit=e=>{
  if(frm.dataset.mode==='test')return;
  if(frm.dataset.mode==='spk')return saveSPKf(e);
  if(frm.dataset.mode==='hk')return saveHKf(e);
  if(frm.dataset.mode)return frm.dataset.mode==='pw'?savePw():saveU();
  if(frm.dataset.multi)return saveMulti(e);
  const p=PAGES[page],o=Object.fromEntries(new FormData(frm));o.ID=frm.dataset.id;
  p.f.forEach(f=>{if(f[2]==='number')o[f[0]]=Number(o[f[0]]||0)});
  api('save',[p.sheet,o],()=>{toast('Tersimpan ✓');load()});
};
function del(id){if(!confirm('Hapus data ini?'))return;const p=PAGES[page];
  api('remove',[p.sheet,id],()=>{toast('Terhapus');load()})}

function laporan(){
  const rows=D.Orders.filter(o=>(!R.from||o.Tgl>=R.from)&&(!R.to||o.Tgl<=R.to)&&(!R.cust||o.Customer===R.cust)).map(o=>{
    const hn=n=>sum((D.HasilKerja||[]).filter(x=>x.OrderID===o.ID),x=>Number(x['L'+n+'_Jml']||0)+Number(x['L'+n+'_Koreksi']||0));
    const h1=hn(1),h2=hn(2),h3=hn(3);
    return {...o,h1,h2,h3,sisa:o.Jumlah-h1-h2-h3,nilai:o.Jumlah*o.Harga}});
  window._rep=rows;
  $('#view').innerHTML=`<div class="tools">
   <input type="date" value="${R.from}" onchange="R.from=this.value;laporan()"><input type="date" value="${R.to}" onchange="R.to=this.value;laporan()">
   <select onchange="R.cust=this.value;laporan()"><option value="">Semua Customer</option>${D.Customer.map(c=>`<option ${c.Nama===R.cust?'selected':''}>${esc(c.Nama)}</option>`).join('')}</select>
   <span class="grow"></span><button class="btn g" onclick="csv()">Export CSV</button><button class="btn" onclick="print()">Cetak</button></div>
  <div class="grid"><div class="card kpi"><div class="l">Jumlah Order</div><div class="v">${rows.length}</div></div>
   <div class="card kpi"><div class="l">Total Jumlah</div><div class="v">${num(sum(rows,r=>r.Jumlah))}</div></div>
   <div class="card kpi"><div class="l">Total Sisa</div><div class="v">${num(sum(rows,r=>r.sisa))}</div></div>

const FSG={std:[18,8,34,30],compact:[23,10,24,26],side:[42,0,28,46],sheet:[10,22,50,24],full:[3,3,64,40]};
function fsSvg(k){const[x,y,w,h]=FSG[k];return `<svg viewBox="0 0 70 46" fill="none"><rect x="1" y="1" width="68" height="44" rx="4" stroke="currentColor" stroke-width="1.5" opacity=".5"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--ac)" opacity=".85"/><rect x="${x+4}" y="${y+5}" width="${Math.max(8,w-14)}" height="3" rx="1.5" fill="#fff" opacity=".9"/><rect x="${x+4}" y="${y+12}" width="${Math.max(8,w-8)}" height="3" rx="1.5" fill="#fff" opacity=".6"/></svg>`}
function setFS(k){FS=k;try{localStorage.setItem('wo_fs',k)}catch(e){}toast('Tampilan form: '+FSO.find(o=>o[0]===k)[1]);pengaturan()}
function slSvg(k){
  const f='currentColor',B=(x,y,w,o)=>`<rect x="${x}" y="${y}" width="${w}" height="3" rx="1.5" fill="${f}" opacity="${o||.35}"/>`,C=(x,y)=>`<rect x="${x}" y="${y}" width="4" height="4" rx="1" fill="var(--ac)"/>`;
  let i='';
  if(k==='tabel')for(let r=0;r<4;r++){const y=7+r*9;i+=C(5,y)+B(13,y+.5,13,.7)+B(30,y+.5,22)+B(56,y+.5,10)}
  else if(k==='kartu')for(let r=0;r<2;r++)for(let c=0;c<2;c++){const x=5+c*32,y=5+r*20;i+=`<rect x="${x}" y="${y}" width="28" height="16" rx="3" fill="none" stroke="${f}" opacity=".4"/>`+C(x+3,y+3)+B(x+10,y+3.5,14,.7)+B(x+10,y+9,12)}
  else if(k==='ringkas')for(let r=0;r<3;r++){const y=5+r*13;i+=C(5,y+2)+B(13,y,40,.7)+B(13,y+6,24)+`<rect x="54" y="${y+2}" width="12" height="4" rx="2" fill="var(--ac)" opacity=".5"/>`}
  else for(let r=0;r<2;r++){const y=4+r*21;i+=`<rect x="3" y="${y}" width="64" height="5" rx="1.5" fill="${f}" opacity=".18"/>`+B(5,y+1,16,.7)+C(5,y+8)+B(13,y+9,36)+C(5,y+14)+B(13,y+15,30)}
  return `<svg viewBox="0 0 70 46" fill="none"><rect x="1" y="1" width="68" height="44" rx="4" stroke="currentColor" stroke-width="1.5" opacity=".5"/>${i}</svg>`;
}

  $('#view').innerHTML='<div class="empty">Memuat…</div>';
  api('listUsers',[],us=>{$('#view').innerHTML=`<div class="card tw" style="padding:6px"><table><tr><th>Username</th><th>Nama</th><th></th></tr>
  ${us.map(u=>`<tr><td>${esc(u.Username)}</td><td>${esc(u.Nama)}</td><td class="act">${String(u.Username).toLowerCase()===String(ME.user).toLowerCase()?'<span class="badge Selesai">Anda</span>':`<a class="d" onclick="delU('${esc(u.Username)}')">Hapus</a>`}</td></tr>`).join('')}</table></div>`});
}
function modal(t,h,m){$('#mh').textContent=t;$('#mb').innerHTML=h;frm.dataset.mode=m;frm.dataset.multi='';dlg.classList.remove('wide');openD()}
function addU(){modal('Tambah Pengguna',`<div><label>Username</label><input name="u" required></div><div><label>Nama</label><input name="n"></div><div class="full"><label>Password (min. 6 karakter)</label><input name="p" type="password" minlength="6" required></div>`,'u')}
function saveU(){api('addUser',[frm.elements.u.value,frm.elements.n.value,frm.elements.p.value],()=>{toast('Pengguna ditambahkan ✓');pengguna()})}
function pw(){modal('Ganti Password',`<div class="full"><label>Password lama</label><input name="o" type="password" required></div><div class="full"><label>Password baru (min. 6 karakter)</label><input name="n" type="password" minlength="6" required></div>`,'pw')}
function savePw(){api('changePassword',[frm.elements.o.value,frm.elements.n.value],()=>toast('Password diganti ✓'))}
function delU(u){if(confirm('Hapus pengguna '+u+'?'))api('deleteUser',[u],()=>{toast('Terhapus');pengguna()})}

/* ---------- Login ---------- */
function setWho(r){ME=r;$('#who').innerHTML='<b>'+esc(r.nama)+'</b><br><span style="opacity:.6">@'+esc(r.user)+'</span>'}
function showLogin(m){TOKEN='';store('wo_t',null);store('wo_u',null);$('#view').innerHTML='';$('#le').textContent=m||'';$('#login').classList.add('on');setTimeout(()=>$('#lu').focus(),50)}
function enter(r){TOKEN=r.token;store('wo_t',r.token);store('wo_u',JSON.stringify({user:r.user,nama:r.nama}));setWho(r);$('#login').classList.remove('on');load()}
$('#lf').onsubmit=e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Memeriksa…';
  const done=()=>{b.disabled=false;b.textContent='Masuk'};
  google.script.run.withSuccessHandler(r=>{done();$('#lp').value='';enter(r)}).withFailureHandler(x=>{done();$('#le').textContent=String(x.message).replace(/^Exception: /,'')}).login($('#lu').value.trim(),$('#lp').value)};
function logout(){api('logout',[]);showLogin('')}
(function(){let t=null,u=null;try{t=sessionStorage.getItem('wo_t');u=JSON.parse(sessionStorage.getItem('wo_u'))}catch(e){}
  if(t&&u){TOKEN=t;setWho(u);load()}else showLogin('')})();
</script>
</body>
</html>
