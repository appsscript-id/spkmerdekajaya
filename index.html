<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surat Perintah Kerja</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2540;--brand:#243B7A;--brand-2:#3552B5;--accent:#F2B01E;--bg:#F2F4F8;--card:#fff;--line:#E3E7EF;--mute:#6B7690;--ok:#1E8E5A;--warn:#B77A00;--bad:#C93B3B;
--sh:0 1px 2px rgba(27,37,64,.06),0 6px 18px rgba(27,37,64,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.top .in{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:800}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top small{display:block;opacity:.7;font-weight:400;font-size:12px}
.sp{flex:1}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--ink)}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn.del{color:var(--bad)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
main{max-width:1200px;margin:auto;padding:22px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);border-left:4px solid var(--line)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.stat span{color:var(--mute);font-size:12.5px}
.stat.a{border-color:var(--brand-2)}.stat.b{border-color:var(--accent)}.stat.c{border-color:var(--ok)}.stat.d{border-color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;margin:22px 0 14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:200px;max-width:340px;margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.spk{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px}
.spk .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font-weight:800;font-size:15px}
.cust{color:var(--mute);font-size:13px}
.tag{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.Draft{background:#EDEFF4;color:var(--mute)}.tag.Proses{background:#FFF1CC;color:var(--warn)}.tag.Selesai{background:#DDF3E8;color:var(--ok)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px}
.meta i{display:block;font-style:normal;color:var(--mute);font-size:11.5px}
.late{color:var(--bad);font-weight:700}
.items{border-top:1px dashed var(--line);padding-top:10px;font-size:13px;display:grid;gap:5px}
.items div{display:flex;justify-content:space-between;gap:10px}
.items span:last-child{white-space:nowrap;font-weight:600}
.items em{color:var(--mute);font-style:normal;font-size:12px}
.foot{display:flex;gap:6px;align-items:center;margin-top:auto;flex-wrap:wrap}
.foot select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;font-size:12.5px}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;background:#fff;border-radius:14px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(27,37,64,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:20}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:860px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{margin:0;font-size:17px}
.modal .bd{padding:20px 22px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f label,.full label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:3px}
.f input,.f select,.f textarea,.full textarea,.tbl input,.tbl select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.span2{grid-column:span 2}.span3{grid-column:span 3}
h3{font-size:14px;margin:20px 0 8px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-align:left;color:var(--mute);padding:4px 4px}
.tbl td{padding:3px 3px;vertical-align:top}
.x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer;padding:4px 8px}
.tot{text-align:right;font-weight:700;margin-top:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:50}
.toast.err{background:var(--bad)}
.load{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .4s;z-index:60}
#pa{display:none}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.f{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.tbl{min-width:640px}.tw{overflow-x:auto}}
@media print{
 body>*:not(#pa){display:none!important}
 #pa{display:block;color:#000;font-size:12px;padding:10px}
 #pa h1{font-size:20px;margin:0 0 2px}
 #pa table{width:100%;border-collapse:collapse;margin:12px 0}
 #pa th,#pa td{border:1px solid #444;padding:5px 7px;text-align:left}
 #pa .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;text-align:center}
 #pa .sg div{height:90px;border-bottom:1px solid #000}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="load" id="ld"></div>
<div class="top"><div class="in">
  <div class="logo">SPK</div>
  <h1>Surat Perintah Kerja<small>Pantau dan terbitkan perintah produksi</small></h1>
  <div class="sp"></div>
  <button class="btn" id="new">+ SPK baru</button>
</div></div>

<main>
  <section class="stats" id="stats"></section>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <input class="search" id="q" placeholder="Cari no SPK, customer, PO, uraian" aria-label="Cari">
  </div>
  <section class="grid" id="grid"></section>
</main>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <header><h2 id="mt">SPK baru</h2><button class="x" id="cl" aria-label="Tutup">&times;</button></header>
  <div class="bd">
    <div class="f">
      <div><label>Tanggal</label><input type="date" id="tgl"></div>
      <div class="span2"><label>Nama customer</label><input id="cus" list="cl-list" placeholder="mis. Janur Kuning"><datalist id="cl-list"></datalist></div>
      <div><label>No PO / SJ</label><input id="po" placeholder="mis. BJK0902"></div>
      <div><label>Deadline</label><input type="date" id="dl"></div>
      <div><label>Status</label><select id="st"><option>Draft</option><option>Proses</option><option>Selesai</option></select></div>
      <div class="span3"><label>Catatan</label><textarea id="cat" rows="2"></textarea></div>
    </div>
    <h3>Uraian pekerjaan</h3>
    <div class="tw"><table class="tbl"><thead><tr><th style="width:38%">Uraian</th><th>Ukuran</th><th>Jumlah</th><th>Satuan</th><th>Harga PO</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <button class="btn sec sm" id="add" style="margin-top:8px">+ Tambah baris</button>
    <div class="tot" id="tot"></div>
  </div>
  <footer><button class="btn sec" id="cn">Batal</button><button class="btn" id="sv">Simpan SPK</button></footer>
</div></div>

<div id="pa"></div>
<div class="toast" id="ts"></div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('id-ID').format(n || 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const dt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : '-';
const S = {rows: [], f: 'Semua', q: '', edit: null};

function toast(m, err) {
  const t = $('#ts'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3000);
}
function busy(on) { const l = $('#ld'); l.style.width = on ? '70%' : '100%'; if (!on) setTimeout(() => l.style.width = 0, 300); }
const API = 'https://script.google.com/macros/s/AKfycbzeje_VPgCm0G0QQJuBA38i1ZHtx77hzKILeMn2XnKfTzc2f9xjUzyeMKzcdqBowWL8Og/exec'; // URL hasil Deploy Apps Script
let KEY = ''; try { KEY = localStorage.getItem('spk_key') || ''; } catch (e) {}
async function run(fn, ...args) {
  busy(true);
  try {
    if (!KEY) KEY = prompt('Masukkan kunci akses SPK:') || '';
    const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({key: KEY, action: fn, args})});
    const j = await r.json();
    if (!j.ok) {
      if (j.error === 'Kunci akses salah') { KEY = ''; try { localStorage.removeItem('spk_key'); } catch (e) {} }
      throw new Error(j.error);
    }
    try { localStorage.setItem('spk_key', KEY); } catch (e) {}
    return j.data;
  } catch (e) { toast(e.message || 'Gagal terhubung ke server', true); throw e; }
  finally { busy(false); }
}

function groups() {
  const m = {};
  S.rows.forEach(r => {
    const g = m[r.no] || (m[r.no] = {no: r.no, tgl: r.tgl, customer: r.customer, po: r.po, status: r.status, deadline: r.deadline, catatan: r.catatan, items: []});
    g.items.push(r);
  });
  return Object.values(m).sort((a, b) => b.no.localeCompare(a.no));
}
const total = g => g.items.reduce((s, i) => s + i.jumlah * i.harga, 0);
const qty = g => g.items.reduce((s, i) => s + i.jumlah, 0);

function render() {
  const all = groups();
  const meter = all.reduce((s, g) => s + g.items.filter(i => i.satuan === 'm').reduce((a, i) => a + i.jumlah, 0), 0);
  $('#stats').innerHTML =
    `<div class="stat a"><b>${all.length}</b><span>Total SPK</span></div>
     <div class="stat b"><b>${all.filter(g => g.status === 'Proses').length}</b><span>Sedang diproses</span></div>
     <div class="stat c"><b>${all.filter(g => g.status === 'Selesai').length}</b><span>Selesai</span></div>
     <div class="stat d"><b>${fmt(meter)} m</b><span>Total panjang kain</span></div>`;

  $('#chips').innerHTML = ['Semua', 'Draft', 'Proses', 'Selesai'].map(c =>
    `<button class="chip ${S.f === c ? 'on' : ''}" data-f="${c}">${c}${c === 'Semua' ? '' : ' (' + all.filter(g => g.status === c).length + ')'}</button>`).join('');

  const q = S.q.toLowerCase();
  const list = all.filter(g => (S.f === 'Semua' || g.status === S.f) &&
    (!q || (g.no + g.customer + g.po + g.items.map(i => i.uraian).join(' ')).toLowerCase().includes(q)));

  $('#grid').innerHTML = list.length ? list.map(g => {
    const late = g.deadline && g.status !== 'Selesai' && g.deadline < today();
    return `<article class="spk" data-no="${esc(g.no)}">
      <div class="h"><div><div class="no">${esc(g.no)}</div><div class="cust">${esc(g.customer)}</div></div><span class="tag ${g.status}">${g.status}</span></div>
      <div class="meta">
        <div><i>Tanggal</i>${dt(g.tgl)}</div>
        <div><i>Deadline</i><span class="${late ? 'late' : ''}">${dt(g.deadline)}${late ? ' (lewat)' : ''}</span></div>
        <div><i>PO / SJ</i>${esc(g.po) || '-'}</div>
        <div><i>Nilai PO</i>Rp ${fmt(total(g))}</div>
      </div>
      <div class="items">
        ${g.items.slice(0, 3).map(i => `<div><span>${esc(i.uraian)} <em>${esc(i.ukuran)}</em></span><span>${fmt(i.jumlah)} ${esc(i.satuan)}</span></div>`).join('')}
        ${g.items.length > 3 ? `<em>+ ${g.items.length - 3} uraian lainnya</em>` : ''}
      </div>
      <div class="foot">
        <select data-a="st" aria-label="Ubah status">${['Draft', 'Proses', 'Selesai'].map(s => `<option ${s === g.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <div class="sp"></div>
        <button class="btn sec sm" data-a="pr">Cetak</button>
        <button class="btn sec sm" data-a="ed">Ubah</button>
        <button class="btn sec sm del" data-a="rm">Hapus</button>
      </div></article>`;
  }).join('') : `<div class="empty"><b>Belum ada SPK</b><br>Klik “+ SPK baru” untuk menerbitkan perintah kerja pertama.</div>`;
}

async function load() { S.rows = await run('getData'); render(); }

/* ---------- form ---------- */
function rowHtml(i = {}) {
  return `<tr>
    <td><input data-k="uraian" value="${esc(i.uraian)}" placeholder="mis. Spb 40 Htm + F4 abu Sc + TC Htm"></td>
    <td><input data-k="ukuran" value="${esc(i.ukuran)}" placeholder='60"' style="width:70px"></td>
    <td><input data-k="jumlah" type="number" min="0" step="any" value="${i.jumlah || ''}" style="width:90px"></td>
    <td><select data-k="satuan">${['m', 'yard', 'roll', 'pcs', 'kg'].map(s => `<option ${s === (i.satuan || 'm') ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
    <td><input data-k="harga" type="number" min="0" step="any" value="${i.harga || ''}" style="width:110px"></td>
    <td><button class="x" type="button" data-x aria-label="Hapus baris">&times;</button></td></tr>`;
}
function openForm(no) {
  const g = no ? groups().find(x => x.no === no) : null;
  S.edit = no || null;
  $('#mt').textContent = g ? 'Ubah ' + g.no : 'SPK baru';
  $('#tgl').value = g ? g.tgl : today();
  $('#cus').value = g ? g.customer : '';
  $('#po').value = g ? g.po : '';
  $('#dl').value = g ? g.deadline : '';
  $('#st').value = g ? g.status : 'Draft';
  $('#cat').value = g ? g.catatan : '';
  $('#cl-list').innerHTML = [...new Set(S.rows.map(r => r.customer))].map(c => `<option value="${esc(c)}">`).join('');
  $('#rows').innerHTML = (g ? g.items : [{}]).map(rowHtml).join('');
  calc(); $('#ov').classList.add('on'); $('#cus').focus();
}
const closeForm = () => $('#ov').classList.remove('on');
function readItems() {
  return [...$('#rows').rows].map(tr => {
    const o = {}; tr.querySelectorAll('[data-k]').forEach(e => o[e.dataset.k] = e.value); return o;
  });
}
function calc() {
  const t = readItems().reduce((s, i) => s + (+i.jumlah || 0) * (+i.harga || 0), 0);
  $('#tot').textContent = 'Total nilai PO: Rp ' + fmt(t);
}
async function save() {
  const d = {no: S.edit, tgl: $('#tgl').value, customer: $('#cus').value, po: $('#po').value,
    deadline: $('#dl').value, status: $('#st').value, catatan: $('#cat').value, items: readItems()};
  $('#sv').disabled = true;
  try { const no = await run('saveSpk', d); closeForm(); toast('SPK ' + no + ' tersimpan'); await load(); }
  catch (e) {} finally { $('#sv').disabled = false; }
}

/* ---------- cetak ---------- */
function printSpk(no) {
  const g = groups().find(x => x.no === no); if (!g) return;
  $('#pa').innerHTML = `<h1>SURAT PERINTAH KERJA</h1><div><b>${esc(g.no)}</b></div>
    <table><tr><td>Tanggal: ${dt(g.tgl)}</td><td>Customer: ${esc(g.customer)}</td></tr>
    <tr><td>PO / SJ: ${esc(g.po) || '-'}</td><td>Deadline: ${dt(g.deadline)}</td></tr></table>
    <table><thead><tr><th>No</th><th>Uraian</th><th>Ukuran</th><th>Jumlah</th><th>Satuan</th></tr></thead><tbody>
    ${g.items.map((i, n) => `<tr><td>${n + 1}</td><td>${esc(i.uraian)}</td><td>${esc(i.ukuran)}</td><td>${fmt(i.jumlah)}</td><td>${esc(i.satuan)}</td></tr>`).join('')}
    </tbody></table><div>Catatan: ${esc(g.catatan) || '-'}</div>
    <div class="sg"><div>Dibuat oleh</div><div>Diperiksa</div><div>Produksi</div></div>`;
  window.print();
}

/* ---------- events ---------- */
$('#new').onclick = () => openForm();
$('#cl').onclick = $('#cn').onclick = closeForm;
$('#sv').onclick = save;
$('#add').onclick = () => $('#rows').insertAdjacentHTML('beforeend', rowHtml());
$('#rows').addEventListener('input', calc);
$('#rows').addEventListener('click', e => { if (e.target.dataset.x !== undefined && $('#rows').rows.length > 1) { e.target.closest('tr').remove(); calc(); } });
$('#q').oninput = e => { S.q = e.target.value; render(); };
$('#chips').onclick = e => { if (e.target.dataset.f) { S.f = e.target.dataset.f; render(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
$('#grid').addEventListener('click', async e => {
  const a = e.target.dataset.a, no = e.target.closest('.spk')?.dataset.no;
  if (!a || !no) return;
  if (a === 'ed') openForm(no);
  if (a === 'pr') printSpk(no);
  if (a === 'rm' && confirm('Hapus ' + no + '? Data di spreadsheet ikut terhapus.')) { await run('deleteSpk', no); toast('SPK dihapus'); load(); }
});
$('#grid').addEventListener('change', async e => {
  if (e.target.dataset.a !== 'st') return;
  await run('updateStatus', e.target.closest('.spk').dataset.no, e.target.value); toast('Status diperbarui'); load();
});
load();
</script>
</body>
</html>
